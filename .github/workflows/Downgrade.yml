name: "Downgrade"

on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  downgrade:
    name: "Downgrade"
    uses: "SciML/.github/.github/workflows/downgrade.yml@v1"
    with:
      julia-version: "lts"
      # Downgrade runs GROUP=All in one process. SciMLTesting then activates the
      # Plotting sub-env after Core has already loaded floor SciMLBase; the
      # reusable workflow also strips secondary Manifests before test, so
      # Plotting re-resolves to latest LinearSolve and hits EigenvalueProblem.
      # projects: ".,test/Plotting" was tried (run 38323770615) and still fails
      # that way. Restrict Downgrade to Core; plotting test deps lose floor check.
      group: "Core"
    secrets: "inherit"
