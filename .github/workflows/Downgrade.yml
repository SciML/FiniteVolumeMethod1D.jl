name: "Downgrade"

on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  downgrade:
    name: "Downgrade"
    uses: "SciML/.github/.github/workflows/downgrade.yml@v1"
    with:
      julia-version: "lts"
      # SciMLTesting resolves test/Plotting's sub-env to latest versions in the same
      # process that already loaded Core's floor SciMLBase, so only Core is floor-tested.
      group: "Core"
    secrets: "inherit"
